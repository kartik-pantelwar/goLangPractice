<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="converter-card">
            <h1>💱 Currency Converter</h1>
            <p class="subtitle">Convert currencies with real-time exchange rates</p>
            
            <form id="currencyForm">
                <div class="input-group">
                    <label for="amount">Amount</label>
                    <input 
                        type="number" 
                        id="amount" 
                        placeholder="Enter amount" 
                        min="0" 
                        step="0.01" 
                        required
                    >
                </div>

                <div class="currency-row">
                    <div class="currency-group">
                        <label for="fromCurrency">From</label>
                        <select id="fromCurrency" required>
                            <option value="">Select currency</option>
                        </select>
                    </div>

                    <button type="button" id="swapBtn" class="swap-btn" title="Swap currencies">
                        ⇄
                    </button>

                    <div class="currency-group">
                        <label for="toCurrency">To</label>
                        <select id="toCurrency" required>
                            <option value="">Select currency</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="convertBtn" class="convert-btn">
                    Convert
                </button>
            </form>

            <div id="result" class="result hidden">
                <div class="result-content">
                    <h3>Conversion Result</h3>
                    <div class="conversion-display">
                        <span id="fromAmount"></span>
                        <span class="arrow">→</span>
                        <span id="toAmount"></span>
                    </div>
                    <div class="rate-info">
                        <small id="exchangeRate"></small>
                    </div>
                </div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Converting...</p>
            </div>

            <div id="error" class="error hidden">
                <p id="errorMessage"></p>
            </div>
        </div>

        <footer>
            <p>Powered by <a href="https://github.com/fawazahmed0/exchange-api" target="_blank">Free Currency Exchange API</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
